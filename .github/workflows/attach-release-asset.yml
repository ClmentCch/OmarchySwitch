# One-shot helper: attach the verified v0.1.0 archive to the existing GitHub
# release. Lives on the `release-asset` branch only; it is not part of the
# distribution sources.
name: attach-release-asset

on:
  push:
    branches: [release-asset]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                 --json tagName --jq '.[0].tagName')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::No release found in $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "Using release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify the archive before uploading
        run: |
          set -euo pipefail
          sha256sum -c release/OmarchySwitch-Base-v0.1.0.zip.sha256 \
            --ignore-missing 2>/dev/null || true
          cd release && sha256sum -c OmarchySwitch-Base-v0.1.0.zip.sha256
          unzip -t OmarchySwitch-Base-v0.1.0.zip >/dev/null

      - name: Upload asset to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.rel.outputs.tag }}" \
            release/OmarchySwitch-Base-v0.1.0.zip \
            release/OmarchySwitch-Base-v0.1.0.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

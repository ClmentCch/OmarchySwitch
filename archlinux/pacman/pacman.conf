#
# /etc/pacman.conf — OmarchySwitch (Arch Linux ARM, aarch64)
#
# Copied into the rootfs by scripts/build-rootfs.sh.
# Upstream reference: Arch Linux ARM default pacman.conf (aarch64).
#
# Never change Architecture to "auto" or "x86_64": this root filesystem must
# only ever be populated with aarch64 packages.

[options]
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
XferCommand = /usr/bin/curl -L -C - -f -o %o %u
# Colour output helps the first boot diagnostics.
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 4
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- Arch Linux ARM repositories -------------------------------------------
# $arch is substituted from Architecture below; $repo from the section name.
Architecture = aarch64

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# --- Omarchy packages (added on demand) ------------------------------------
# scripts/integrate-omarchy.sh appends:
#   [omarchy]
#   Include = /etc/pacman.d/omarchy-mirrorlist
# Do not add it here: the channel (stable/edge) is a build-time choice, and a
# rootfs built without Omarchy must not fail on an unreachable repository.

# Marker read by the Switchroot L4T initramfs.
#
# The initramfs refuses to switch_root into a partition that does not contain
# this file ("<dev> not a switchroot installation..."). OmarchySwitch is not
# Switchroot's Ubuntu, but it uses their initramfs, so the marker must exist.
#
# Do not delete it: without it the boot stops after the initramfs.
switchroot_version=omarchyswitch-0.1.0

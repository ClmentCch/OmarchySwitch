# OmarchySwitch - central configuration.
#
# Sourced by scripts/lib/common.sh. Every value here is a default.
# Machine-specific overrides belong in configs/local.conf (gitignored).
#
# This file is bash, but it only assigns simple values: no commands, no
# external calls. Keep it that way so `--print-config` and validation can
# read it safely.

# --- Identity -------------------------------------------------------------
DISTRO_NAME="OmarchySwitch"
DISTRO_SHORT="OmarchyS"
DISTRO_ID="omarchyswitch"
DISTRO_CODENAME="erista"
DISTRO_VERSION="$(cat "$(dirname "${BASH_SOURCE[0]}")/../VERSION" 2>/dev/null || echo 0.1.0)"
DISTRO_HOME_URL="https://github.com/ClmentCch/OmarchySwitch"

# --- Target hardware ------------------------------------------------------
# Nintendo Switch V1 only. Mariko (T210B01) is deliberately out of scope
# for this base: different PMIC, different DVFS, different kernel support.
TARGET_ARCH="aarch64"
TARGET_MODEL="Nintendo Switch V1 (HAC-001)"
TARGET_SOC="NVIDIA Tegra X1 (T210, ODNX02-A2)"
TARGET_BOARD_FAMILY="erista"
TARGET_DISPLAY="720x1280 DSI (JDI LPM062M326A), portrait panel rotated to landscape"

# Reject any package, binary or path that is not aarch64. Scripts read this
# to decide whether a build step is allowed to run.
ENFORCE_AARCH64=1

# --- Arch Linux ARM -------------------------------------------------------
ALARM_TARBALL_URL="https://archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
# Empty string = not pinned. build-rootfs.sh refuses an unpinned tarball
# unless --allow-unpinned-tarball is passed explicitly, because Arch Linux
# ARM regenerates this file and the checksum changes.
ALARM_TARBALL_SHA256=""
ALARM_MIRROR="http://mirror.archlinuxarm.org"
ALARM_PACMAN_CONF="archlinux/pacman/pacman.conf"
ALARM_MIRRORLIST="archlinux/pacman/mirrorlist"

# --- Omarchy --------------------------------------------------------------
OMARCHY_REPO="https://github.com/omacom/omarchy.git"
OMARCHY_TAG="v4.5.0"
OMARCHY_PKG_REPO_STABLE="https://pkgs.omarchy.org/stable/aarch64"
OMARCHY_PKG_REPO_EDGE="https://pkgs.omarchy.org/edge/aarch64"
OMARCHY_PACKAGE_CHANNEL="stable"
# Omarchy's own kernel targets NVIDIA ARM machines, not Tegra X1. Never
# install it on the Switch: it would replace the Switchroot kernel.
OMARCHY_INSTALL_KERNEL=0

# --- hekate / bootloader --------------------------------------------------
HEKATE_VERSION="v6.5.4"
HEKATE_REPO="https://github.com/CTCaer/hekate.git"
HEKATE_RELEASE_URL="https://github.com/CTCaer/hekate/releases/tag/v6.5.4"

# --- Switchroot compatibility layer --------------------------------------
# Pinned reference only: the binaries themselves are fetched by the user,
# verified against switchroot/manifest.toml, and never committed.
SWITCHROOT_MANIFEST="switchroot/manifest.toml"
SWITCHROOT_KERNEL_REPO="https://gitlab.com/switchroot/kernel/l4t-kernel-4.9"
SWITCHROOT_KERNEL_REF="linux-5.1.0_r2"
SWITCHROOT_UBOOT_REPO="https://gitlab.com/switchroot/bootstack/switch-uboot"
SWITCHROOT_ATF_REPO="https://gitlab.com/switchroot/bootstack/switch-atf"
SWITCHROOT_INITRAMFS_REPO="https://gitlab.com/switchroot/kernel/l4t-initramfs"
SWITCHROOT_BOOT_PREFIX="/switchroot/omarchyswitch"
SWITCHROOT_VERSION_FILE_VALUE="omarchyswitch-0.1.0"

# --- Disk layout ----------------------------------------------------------
# GPT, two partitions. Sizes are fallback values used only when the target
# device is a file; a real SD card keeps its own size.
BOOT_PART_SIZE="1024MiB"
BOOT_FS_LABEL="OMARCHYSW"
ROOT_FS_LABEL="OSWITCH"          # must stay <= 7 chars: hekate id= limit
ROOT_PART_SIZE="12GiB"
IMAGE_SIZE="16G"

# --- Desktop --------------------------------------------------------------
DESKTOP_SESSION="hyprland"
DESKTOP_COMPOSITOR_PACKAGE="hyprland"
DESKTOP_TERMINAL_PACKAGE="foot"
DESKTOP_FONT_PACKAGE="ttf-jetbrains-mono-nerd"
# 720p panel: fractional scaling is not worth the GPU cost on GM20B.
DESKTOP_SCALE="1"
DESKTOP_REFRESH="60"

# --- Build behaviour ------------------------------------------------------
BUILD_JOBS="$(nproc 2>/dev/null || echo 2)"
BUILD_LOG_DIR="build/output/logs"
FETCH_RETRIES=3
# Refuse to run destructive steps without an explicit confirmation flag.
SAFETY_CONFIRM_REQUIRED=1

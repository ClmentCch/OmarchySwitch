# OmarchySwitch bring-up entry: kernel log on the built-in panel and on USB.
#
# Copy to: sd:/bootloader/ini/omarchyswitch-erista-debug.ini
#
# This entry exists because a retail Switch has no UART: without a log you get
# a black screen and no information. Two documented channels are used here:
#   fbconsole=0   kernel log on the built-in display
#   uart_port=4   serial log over USB (the Switch appears as a USB device)
#   earlycon=1    print before the UART driver initialises
#
# Remove this entry for normal use: drawing the kernel log on the panel
# prevents a clean hand-off to the display driver, which is why the default
# entry sets fbconsole=9.

[OmarchySwitch (Erista) debug]
l4t=1
boot_prefixes=/switchroot/omarchyswitch/
id=OSWITCH
rootdev=mmcblk0p2
rootfstype=ext4
rootlabel_retries=1
r2p_action=self
fbconsole=0
uart_port=4
earlycon=1
bootargs_extra=loglevel=7

# OmarchySwitch boot entry for hekate ("More configs..." menu).
#
# Copy to: sd:/bootloader/ini/omarchyswitch-erista.ini
# The file name is what hekate shows in the menu, and entries are read in
# ASCII order.
#
# Every key below is documented in the Switchroot README_CONFIG.txt that ships
# with the L4T boot files. Keep this entry comment-free apart from full-line
# '#' comments: hekate's L4T loader parses every key=value line.

[OmarchySwitch (Erista)]
l4t=1
boot_prefixes=/switchroot/omarchyswitch/
id=OSWITCH
rootdev=mmcblk0p2
rootfstype=ext4
rootlabel_retries=1
r2p_action=self
fbconsole=9

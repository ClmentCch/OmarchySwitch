# hekate_ipl.ini - OmarchySwitch
#
# Main hekate configuration for the Nintendo Switch V1 (Erista).
# Place this file at the root of the FAT partition: sd:/bootloader/hekate_ipl.ini
#
# Verified against hekate v6.5.4 (README.md and res/hekate_ipl_template.ini)
# and against the Switchroot L4T .ini keys documented in README_CONFIG.txt,
# which ships with the Switchroot boot files.
#
# Rules that matter and are easy to get wrong:
#   * a full-line '#' comment is safe;
#   * NEVER comment out a key with '#'; the L4T loader still parses the line;
#   * do not put ';' inside a section: hekate forwards it to U-Boot as a
#     key/value and the boot entry misbehaves;
#   * id= is limited to 7 characters, and must match the ext4 label of the
#     Linux partition (ROOT_FS_LABEL in configs/omarchyswitch.conf).
#
# Replace or extend the entries below only after reading bootloader/README.md.

[config]
autoboot=0
autoboot_list=0
bootwait=3
backlight=100
autohosoff=1
autonogc=1
updater2p=0
bootprotect=0

# Nintendo Horizon OS is left to the user's existing setup: this file does
# not define a HOS entry, so adding OmarchySwitch never changes how the
# console boots by default.

[OmarchySwitch (Erista)]
# L4T entry: hekate prepares the boot files and hands over to ATF + U-Boot.
l4t=1
# Directory (on the FAT partition) that holds uImage, initramfs,
# nx-plat.dtimg, boot.scr, bl31.bin and bl33.bin.
boot_prefixes=/switchroot/omarchyswitch/
# Must match the ext4 filesystem label of the Linux root partition.
id=OSWITCH
# Fallback device if the label is not found. On the Switch, the SD card is
# mmcblk0; the internal eMMC is mmcblk1. Label discovery wins when it works.
rootdev=mmcblk0p2
rootlabel_retries=1
r2p_action=self
# 9 = no kernel log on any display. Set to 0 to see the kernel log on the
# built-in panel (useful for bring-up; see the debug entry in configs/).
fbconsole=9
rootfstype=ext4

# OmarchySwitch — Hyprland hardware reference overlay
#
# This file is a REFERENCE, not an automatically loaded configuration.
# The active override is omarchy/configs/hypr/omarchyswitch.conf, installed by
# omarchy/scripts/apply-configs.sh.
#
# Keep the two in sync if you change a hardware value, or copy this file into
# ~/.config/omarchyswitch/ and point the include at it.

# Panel: 720x1280 physical, landscape logical mode.
monitor = eDP-1, 1280x720@60, 0x0, 1

# Touch panel follows the display rotation.
# 0 = 0°, 1 = 90°, 2 = 180°, 3 = 270°.
# TO TEST on hardware; adjust to match the panel orientation actually applied.
input {
    touchdevice {
        transform = 1
    }
}

# Docked output: let the display choose, keep scale 1 to spare the GPU.
monitor = , preferred, auto, 1

# Cursor: software cursors are sometimes required on Tegra to avoid an
# invisible or corrupted pointer. Remove if it causes flicker.
misc {
    no_hardware_cursors = true
}

# OmarchySwitch — Hyprland hardware overrides (Nintendo Switch V1, Erista)
#
# Installed by omarchy/scripts/apply-configs.sh to
#   ~/.config/omarchyswitch/hyprland.conf
# and sourced at the END of ~/.config/hypr/hyprland.conf, so these values win
# over Omarchy's defaults for the keys they set. Nothing else is replaced.
#
# Values marked "TO TEST" have not been validated on hardware.

# --- Output ---------------------------------------------------------------
# The panel is a 720x1280 DSI display mounted in portrait; it is used in
# landscape, so the logical resolution is 1280x720.
monitor = eDP-1, 1280x720@60, 0x0, 1

# Fallback for a docked setup: let Hyprland pick the external output's mode.
monitor = , preferred, auto, 1

# --- Touch ----------------------------------------------------------------
# After rotating the panel, touch coordinates must be rotated too, otherwise
# every tap lands 90 degrees off.
# transform values: 0 = normal, 1 = 90°, 2 = 180°, 3 = 270°.
# TO TEST: the correct value depends on the rotation applied to the panel.
input {
    touchdevice {
        transform = 1
    }
    # Touch input has no hover and no acceleration.
    accel_profile = flat
}

# --- Effects: keep the GM20B cool ----------------------------------------
# Blur is the single most expensive effect on this GPU. Omarchy's defaults are
# tuned for desktop GPUs.
decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 12
    }
}

animations {
    # Keep animations (they are part of the Omarchy feel) but shorten them.
    enabled = true
}

# Variable refresh rate reduces work when nothing moves.
misc {
    vfr = true
    # TO TEST: explicit software cursors sometimes fix an invisible cursor on
    # Tegra. Remove this line if the cursor flickers.
    no_hardware_cursors = true
}

# --- Layout for a small screen -------------------------------------------
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
}

# --- Power ----------------------------------------------------------------
# Do not let the screen stay at full brightness on battery: Omarchy's idle
# handling calls hypridle, which needs a working battery source (see
# hardware/aarch64-tegra-x1/power/README.md).

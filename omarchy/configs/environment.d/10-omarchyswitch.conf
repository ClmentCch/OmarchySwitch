# /etc/environment.d/10-omarchyswitch.conf
#
# Session-wide environment for uwsm + Hyprland on the Switch.
# systemd reads this for user sessions (pam_env / systemd --user). Keep it
# minimal: every variable here affects every graphical application.

# Wayland session identity, needed by uwsm and by portal implementations.
XDG_SESSION_TYPE=wayland
XDG_CURRENT_DESKTOP=Hyprland
XDG_SESSION_DESKTOP=Hyprland

# Toolkit backends: XWayland is available but must not be the default.
MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland
ELECTRON_OZONE_PLATFORM_HINT=auto

# The panel is 1280x720 at scale 1; do not let toolkits guess otherwise.
GDK_SCALE=1
GDK_DPI_SCALE=1

# Tegra: never force software rendering. The BSP provides the EGL vendor and
# libglvnd picks it up; LIBGL_ALWAYS_SOFTWARE would silently make everything
# unusably slow.
